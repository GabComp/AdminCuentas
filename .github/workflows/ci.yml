name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore AdministradorDeCuentas.sln

      - name: Compilar
        run: dotnet build AdministradorDeCuentas.sln --no-restore -c Release

      - name: Probar
        run: dotnet test AdministradorDeCuentas.sln --no-build -c Release
